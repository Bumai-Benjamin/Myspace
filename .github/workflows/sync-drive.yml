# Every 15 minutes: look in the Google Drive "My Space" folder for new photos.
# New ones are converted and committed; that push makes Netlify redeploy the site.
name: Sync photos from Google Drive

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may run it a few minutes late; that's normal
  workflow_dispatch:          # the "Run workflow" button, to check right now

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch new photos from Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: 1Y7G3LP3ac642vgqPizC5Wpf6OyiS9vl7   # the "My Space" folder
        run: python scripts/sync_drive.py

      - name: Commit and push (Netlify redeploys on push)
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "benitia-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos src/auto-photos.json data/drive-seen.json
          git commit -m "Add new photos from Google Drive"
          git push
